<div class="page">
  <div class="page-header">
    <h1>My Auctions</h1>

    <button mat-raised-button color="primary" routerLink="/ads/create">
      + Create New
    </button>
  </div>

  @if (loading()) {
    <app-spinner />
  } @else {
    <div class="ads-grid">
      @for (ad of ads(); track ad.id) {
        <mat-card>
          @if (ad.image) {
            <img
              mat-card-image
              [src]="ad.image"
              [alt]="ad.title"
              class="ad-image"
            />
          }

          <mat-card-header class="ad-card-header">
            <mat-card-title class="ad-card-title">{{
              ad.title
            }}</mat-card-title>
            <mat-card-subtitle>{{ ad.location }}</mat-card-subtitle>
          </mat-card-header>

          <mat-card-content class="ad-card-content">
            <div class="ad-footer">
              <span
                class="ad-price"
                [class.live]="notificationService.liveAdPrices()[ad.id!]"
              >
                ${{ livePrice(ad) }}
              </span>

              <mat-chip-set>
                <mat-chip [style.background]="ad.status | adStatusColor">{{
                  ad.status
                }}</mat-chip>
              </mat-chip-set>
            </div>
          </mat-card-content>

          <mat-card-actions class="ad-card-actions">
            <button mat-button [routerLink]="['/ads', ad.id]">View</button>
          </mat-card-actions>
        </mat-card>
      }

      @if (ads().length === 0) {
        <p class="no-results">You have no auctions yet.</p>
      }
    </div>
  }
</div>
