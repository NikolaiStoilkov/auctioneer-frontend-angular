<div class="page-wrapper">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Create Auction</mat-card-title>
    </mat-card-header>
    <mat-card-content class="card-content">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="ad-form">
        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="4"></textarea>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Starting Bid Price</mat-label>
          <input matInput type="number" formControlName="startingBidPrice" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Bid Step</mat-label>
          <input matInput type="number" formControlName="bidStep" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Image URL (optional)</mat-label>
          <input matInput formControlName="image" />
        </mat-form-field>
        @if (error) {
          <p class="form-error">{{ error }}</p>
        }
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Create Auction
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
