<div style="display: flex; justify-content: center; padding: 24px 16px">
  <mat-card style="width: 100%; max-width: 500px">
    <mat-card-header>
      <mat-card-title>Sign Up</mat-card-title>
    </mat-card-header>
    <mat-card-content style="padding-top: 16px">
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        style="display: flex; flex-direction: column; gap: 10px"
      >
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phoneNumber" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>UCN (10 digits)</mat-label>
          <input matInput formControlName="ucn" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Street</mat-label>
          <input matInput formControlName="street" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Street Number</mat-label>
          <input matInput formControlName="streetNumber" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Postal Code</mat-label>
          <input matInput formControlName="postalCode" />
        </mat-form-field>
        @if (error) {
          <p style="color: red; font-size: 0.85rem">{{ error }}</p>
        }
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Sign Up
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <p style="padding: 0 16px 8px">
        Already have an account? <a routerLink="/sign-in">Sign In</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
